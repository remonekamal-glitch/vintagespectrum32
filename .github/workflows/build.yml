
name: Build Vintage Spectrum 32 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q Vintage-Spectrum-32-Java17-Project.zip

      - name: Build APK
        run: gradle -p VintageSpectrum32 assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Vintage-Spectrum-32-APK
          path: VintageSpectrum32/app/build/outputs/apk/debug/app-debug.apk
